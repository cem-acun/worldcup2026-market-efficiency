name: Collect odds

on:
  schedule:
    # Every 2 hours, at :13 past the hour (UTC).
    # Why :13 and not :00 — GitHub's own docs warn that scheduled
    # workflows are delayed or dropped during high load, which peaks
    # at the top of every hour. Offsetting to an odd minute (a prime,
    # away from :00/:15/:30/:45) significantly improves reliability.
    - cron: "13 */2 * * *"
  workflow_dispatch:   # allow manual runs for testing      

permissions:
  contents: write                # needed to commit the data back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@github.com"
          git add data/odds_log.csv
          git diff --staged --quiet || git commit -m "odds $(date -u +%FT%TZ)"
          git push
