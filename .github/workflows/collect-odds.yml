name: Collect odds

on:
  schedule:
    # Backup schedule: every 3 hours at :13 past the hour (UTC).
    # The primary trigger is cron-job.org via repository_dispatch
    # (every 2 hours at :43). This GitHub-native cron exists as a
    # second path because GitHub silently drops scheduled runs
    # during top-of-hour load spikes. :13 + :43 keeps the two
    # triggers ~30 min offset so they don't pile up.
    - cron: "13 */3 * * *"
  repository_dispatch:
    # Backup trigger via external cron service (cron-job.org).
    # GitHub's own cron silently drops runs during high load;
    # this gives us a reliable second path.
    types: [external-trigger]
  workflow_dispatch:   # allow manual runs for testing 

permissions:
  contents: write                # needed to commit the data back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@github.com"
          git add data/odds_log.csv
          git diff --staged --quiet || git commit -m "odds $(date -u +%FT%TZ)"
          git push
