name: Collect odds

on:
  repository_dispatch:
    # Sole reliable trigger: external scheduler (cron-job.org) hits this
    # via GitHub's repository_dispatch API. GitHub's own scheduled
    # workflows are silently dropped during top-of-hour load spikes,
    # so we don't rely on them.
    types: [external-trigger]
  workflow_dispatch:   # allow manual runs for testing

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@github.com"
          git add data/odds_log.csv.gz
          git diff --staged --quiet || git commit -m "odds $(date -u +%FT%TZ)"
          git push
